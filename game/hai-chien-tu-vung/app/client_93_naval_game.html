@media(max-height:500px) and (orientation:landscape){.znav-scores{top:8px;width:min(540px,calc(100% - 20px))}.znav-team{padding-top:5px;padding-bottom:5px}.znav-team strong{font-size:11px}.znav-team small{font-size:8px}.znav-team:before{height:29px;line-height:26px;font-size:18px;top:5px}.znav-home{width:48px;height:48px;padding:10px}.znav-play{bottom:7px;padding:0 14px}.znav-question{min-height:0;margin:0 12% 5px;padding:5px 14px}.znav-word{font-size:23px}.znav-turn{font-size:8px;margin-bottom:2px}.znav-answers{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.znav-answers button{font-size:13px;min-height:40px;padding:5px;gap:7px}.znav-letter{width:24px;height:24px;flex-basis:24px;font-size:17px}.znav-status{font-size:9px;margin:4px 0 0;min-height:12px}.znav-ship{width:51%;height:75%;bottom:23%}.znav-setup{padding:3px 0;font-size:13px}.znav-setup select{padding:4px;font-size:13px}.znav-primary{margin-top:4px;padding:4px 15px}}

/* Joined fleet bars with mirrored emblems and an overlapping Home medallion. */
.znav-scores{width:min(760px,calc(100% - 24px))}
.znav-home{width:76px;height:76px;padding:17px;border-width:2px;box-shadow:0 5px 16px #0009,0 0 0 4px #c6a36566}
.znav-home svg{width:34px;height:34px}
.znav-team:first-child{padding-right:47px;border-right:0}
.znav-team:last-child{padding-left:47px;padding-right:42px;border-left:0;text-align:right}
.znav-team:last-child:before{left:auto;right:7px}
@media(max-height:500px) and (orientation:landscape){.znav-scores{width:min(690px,calc(100% - 20px));top:12px}.znav-home{width:64px;height:64px;padding:13px}.znav-home svg{width:30px;height:30px}.znav-team:first-child{padding-right:39px}.znav-team:last-child{padding-left:39px;padding-right:40px}.znav-team strong{font-size:12px}.znav-team small{font-size:9px}}
</style>
<dialog id="znavDialog" class="znav" aria-label="Hải chiến từ vựng">
 <div class="znav-rotate"><svg viewBox="0 0 80 80" aria-hidden="true"><rect x="20" y="10" width="40" height="60" rx="6" transform="rotate(90 40 40)"/><path d="M12 20A32 32 0 0 1 62 12m-1-8 3 10-11 1M68 60A32 32 0 0 1 18 68m1 8-3-10 11-1"/></svg><strong>Xoay ngang điện thoại để chơi</strong><span>Hải chiến từ vựng chỉ chơi ở chế độ màn hình ngang.</span><button type="button" class="znav-rotate-home">Home — Thoát trò chơi</button></div>
 <div class="znav-scores"><button class="znav-close znav-home" type="button" aria-label="Home — Thoát trò chơi" title="Home — Thoát trò chơi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v12h5v-7h4v7h5V9"/></svg></button></div>
 <div class="znav-sea"><div class="znav-sky" aria-hidden="true"></div><div class="znav-ocean" aria-hidden="true"></div><div class="znav-ocean-near" aria-hidden="true"></div><div class="znav-center">ĐẠI HẢI TRÌNH</div><div class="znav-ship" data-team="0"><img class="znav-sprite" alt="" decoding="async"><i class="znav-smoke"></i><i class="znav-smoke"></i><i class="znav-wake"></i></div><div class="znav-ship" data-team="1"><img class="znav-sprite" alt="" decoding="async"><i class="znav-smoke"></i><i class="znav-smoke"></i><i class="znav-wake"></i></div></div>
 <section class="znav-play"><div class="znav-question"><div class="znav-setup" hidden><label>Chọn lớp học <select class="znav-class" aria-label="Lớp học"><option value="">Chọn một lớp…</option></select></label></div><div class="znav-turn"></div><div class="znav-word"></div></div><div class="znav-answers"></div><p class="znav-status" role="status" aria-live="polite"></p><button type="button" class="znav-primary">Bắt đầu trận</button></section>

</dialog>
<script>
(() => {
 'use strict';
 const dialog=document.getElementById('znavDialog');
 if(!dialog) return;
 const $=s=>dialog.querySelector(s), home=$('.znav-home'), names=['Cướp biển','Hải quân'];
 const damageNames=["Nguyên vẹn","Hư hại nhẹ","Rách buồm, thủng thân","Buồm rách nhiều","Thân tàu hư hại nặng","Cột buồm gãy, khói dày","Tàu vỡ nặng","Bắt đầu cháy","Cháy lớn","Cháy lan toàn tàu","Cháy và chìm"];
 const frames=new Map();
 const frameUrl=(team,level)=>String(window.ZevaNavalArt?.base||'')+(team===0?'pirate':'navy')+'-'+String(level).padStart(2,'0')+'.png';
 function loadFrame(team,level){
  const url=frameUrl(team,level);if(frames.has(url))return frames.get(url);
  const promise=new Promise((resolve,reject)=>{const img=new Image();const timeout=setTimeout(()=>{img.onload=img.onerror=null;reject(Error('Không tải được ảnh tàu. Hãy thử lại.'));},15000);img.onload=()=>{clearTimeout(timeout);resolve(img);};img.onerror=()=>{clearTimeout(timeout);reject(Error('Không tải được ảnh tàu. Hãy thử lại.'));};img.src=url;});
  frames.set(url,promise);promise.catch(()=>{if(frames.get(url)===promise)frames.delete(url);});return promise;
 }
 async function warmFrames(g){for(let level=1;level<=10;level++){if(g!==generation||!dialog.open)return;await Promise.allSettled([loadFrame(0,level),loadFrame(1,level)]);}}
 let words=[],deck=[],damage=[0,0],turn=0,round=0,question=null,locked=true,generation=0,session='',timers=[];
 const shuffle=items=>{const a=items.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
 const norm=s=>String(s||'').normalize('NFC').trim().replace(/\s+/g,' ').toLocaleLowerCase('vi');
 function clearTimers(){timers.forEach(clearTimeout);timers=[];dialog.querySelectorAll('.znav-projectile,.znav-flash,.znav-splash').forEach(n=>{n.getAnimations().forEach(a=>a.cancel());n.remove();});dialog.querySelectorAll('.znav-ship').forEach(n=>n.classList.remove('hit'));}
 function later(fn,ms){const g=generation;timers.push(setTimeout(()=>{if(g===generation&&dialog.open)fn();},ms));}
 function fireVolley(shooter,target,onImpact){
  const sea=$('.znav-sea'),bounds=sea.getBoundingClientRect(),ships=dialog.querySelectorAll('.znav-ship');
  const point=(team,index)=>{
   const img=ships[team].querySelector('.znav-sprite'),r=img.getBoundingClientRect();
   const scale=Math.min(r.width/img.naturalWidth,r.height/img.naturalHeight),w=img.naturalWidth*scale,h=img.naturalHeight*scale;
   return {x:r.left-bounds.left+(r.width-w)/2+w*((team===0?.64:.36)+(index-2)*.035),y:r.bottom-bounds.top-h*.23+(index%2)*h*.018};
  };
  const flash=(p,muzzle)=>{const el=document.createElement('div');el.className='znav-flash '+(muzzle?'znav-muzzle':'znav-impact');el.style.left=p.x+'px';el.style.top=p.y+'px';el.setAttribute('aria-hidden','true');sea.append(el);later(()=>el.remove(),450);};
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const count=reduced?1:5,spacing=110,flight=reduced?180:720;
  for(let i=0;i<count;i++)later(()=>{
   if(!validSession()){clearTimers();fail('Phiên đăng nhập đã thay đổi. Hãy mở lại trò chơi.');return;}
   const from=point(shooter,i),to=point(target,4-i);flash(from,true);
   let ball;
   if(!reduced){
    ball=document.createElement('div');ball.className='znav-projectile';ball.setAttribute('aria-hidden','true');sea.append(ball);
    const arc=Math.min(150,bounds.height*.2,Math.abs(to.x-from.x)*.4),dx=to.x-from.x,dy=to.y-from.y;
    const frames=Array.from({length:33},(_,n)=>{const t=n/32;return {offset:t,transform:`translate3d(${from.x+dx*t}px,${from.y+dy*t-4*arc*t*(1-t)}px,0) rotate(${Math.atan2(dy-4*arc*(1-2*t),dx)}rad)`};});
    ball.animate(frames,{duration:flight,easing:'linear',fill:'forwards'});
   }
   later(()=>{
    if(!validSession()){clearTimers();fail('Phiên đăng nhập đã thay đổi. Hãy mở lại trò chơi.');return;}
    if(ball){ball.getAnimations().forEach(a=>a.cancel());ball.remove();}flash(to,false);
    if(i===count-1)later(onImpact,80);
   },flight);
  },i*spacing);
 }
 function validSession(){return session&&session===String(window.BBG_STATE?.session?.token||'');}
 function scores(){
  $('.znav-scores').replaceChildren(...names.map((name,i)=>{const box=document.createElement('div');box.className='znav-team'+(round>0&&!damage.includes(10)&&turn===i?' active':'');const title=document.createElement('strong');title.textContent=name;const health=document.createElement('div');health.className='znav-health';const bars=document.createElement('div');bars.className='znav-bars';bars.setAttribute('role','meter');bars.setAttribute('aria-label','Độ bền tàu '+name);bars.setAttribute('aria-valuemin','0');bars.setAttribute('aria-valuemax','10');bars.setAttribute('aria-valuenow',String(10-damage[i]));for(let n=0;n<10;n++){const b=document.createElement('i');b.className=n>=10-damage[i]?'lost':'';bars.append(b);}const hp=document.createElement('span');hp.className='znav-hp';hp.textContent=`${10-damage[i]} / 10`;health.append(bars,hp);const label=document.createElement('small');label.textContent=`${damage[i]}/10 loạt • ${damageNames[damage[i]]}`;box.append(title,health,label);return box;}));
  $('.znav-scores').insertBefore(home,$('.znav-scores').children[1]);
  dialog.querySelectorAll('.znav-ship').forEach((ship,i)=>{ship.dataset.damage=String(damage[i]);ship.classList.toggle('sunk',damage[i]===10);ship.setAttribute('role','img');ship.setAttribute('aria-label',names[i]+': '+damageNames[damage[i]]);const url=frameUrl(i,damage[i]);if(ship.firstElementChild.getAttribute('src')!==url)ship.firstElementChild.src=url;});
 }
 function next(){
  if(!validSession())return fail('Phiên đăng nhập đã thay đổi. Hãy đóng game và đăng nhập lại.');
  if(!deck.length)deck=shuffle(words);
  question=deck.pop();round++;locked=false;
  $('.znav-turn').textContent=`LƯỢT ${round} · ĐỘI ${names[turn].toLocaleUpperCase('vi')} TRẢ LỜI`;
  const word=$('.znav-word');word.classList.remove('drop');word.textContent=question.word;void word.offsetWidth;word.classList.add('drop');
  const alternatives=shuffle(words.filter(w=>norm(w.meaning)!==norm(question.meaning))).slice(0,3).map(w=>w.meaning);
  $('.znav-answers').replaceChildren(...shuffle([question.meaning,...alternatives]).map((meaning,i)=>{const b=document.createElement('button');b.type='button';const letter=document.createElement('span');letter.className='znav-letter';letter.textContent='ABCD'[i];letter.setAttribute('aria-hidden','true');const text=document.createElement('span');text.textContent=meaning;b.append(letter,text);b.addEventListener('click',()=>answer(meaning,b));b.dataset.meaning=meaning;return b;}));
  $('.znav-status').textContent='Chọn nghĩa đúng để khai hỏa!';$('.znav-primary').hidden=true;scores();
 }
 async function answer(meaning,selected){
  if(locked||!dialog.open)return;
  if(!validSession())return fail('Phiên đăng nhập đã thay đổi. Hãy mở lại trò chơi.');
  locked=true;const correct=norm(meaning)===norm(question.meaning),target=correct?1-turn:turn,shooter=1-target;
  const g=generation;dialog.querySelectorAll('.znav-answers button').forEach(b=>b.disabled=true);
  $('.znav-status').textContent='Chuẩn bị khai hỏa…';
  try{await loadFrame(target,damage[target]+1);}catch(e){if(g===generation&&dialog.open){locked=false;dialog.querySelectorAll('.znav-answers button').forEach(b=>b.disabled=false);$('.znav-status').textContent=e.message+' Chọn lại đáp án để tiếp tục.';}return;}
  if(g!==generation||!dialog.open)return;
  if(!validSession())return fail('Phiên đăng nhập đã thay đổi. Hãy mở lại trò chơi.');
  dialog.querySelectorAll('.znav-answers button').forEach(b=>{b.disabled=true;if(norm(b.dataset.meaning)===norm(question.meaning))b.classList.add('correct');});
  if(!correct)selected.classList.add('wrong');
  $('.znav-status').textContent=(correct?'Chính xác! ':'Chưa đúng! ')+question.word+' = '+question.meaning+'. '+names[shooter]+' khai hỏa một loạt đại bác!';
  fireVolley(shooter,target,()=>{if(!validSession()){clearTimers();fail('Phiên đăng nhập đã thay đổi. Hãy mở lại trò chơi.');return;}damage[target]=Math.min(10,damage[target]+1);scores();const ship=dialog.querySelectorAll('.znav-ship')[target];ship.classList.add('hit');$('.znav-status').textContent=names[target]+' trúng loạt đạn, mất 1 độ bền.';later(()=>ship.classList.remove('hit'),450);});
  later(()=>{if(!validSession()){clearTimers();fail('Phiên đăng nhập đã thay đổi. Hãy mở lại trò chơi.');return;}if(damage[target]===10){$('.znav-turn').textContent='TRẬN ĐẤU KẾT THÚC';$('.znav-word').textContent=names[1-target]+' chiến thắng!';$('.znav-status').textContent=names[target]+' đã nhận 10 loạt đạn và chìm. Cùng thử một hải trình mới nhé!';$('.znav-primary').textContent='Chơi lại';$('.znav-primary').hidden=false;$('.znav-primary').focus();}else{turn=1-turn;next();$('.znav-answers button').focus();}},1700);
 }
 function fail(message){locked=true;$('.znav-status').textContent=message;$('.znav-primary').textContent='Tải lại bộ từ';$('.znav-primary').hidden=false;$('.znav-primary').disabled=false;words=[];$('.znav-answers').replaceChildren();}
 async function chooseClasses(){
  clearTimers();const g=++generation;locked=true;words=[];deck=[];round=0;damage=[0,0];session=String(window.BBG_STATE?.session?.token||'');scores();
  $('.znav-setup').hidden=false;$('.znav-answers').replaceChildren();$('.znav-word').textContent='Chọn lớp để ra khơi';$('.znav-turn').textContent='BÀI HỌC GẦN NHẤT CỦA LỚP';$('.znav-status').textContent='Đang tải danh sách lớp…';
  const select=$('.znav-class');select.replaceChildren(new Option('Chọn một lớp…',''));select.disabled=true;$('.znav-primary').hidden=true;$('.znav-primary').disabled=true;$('.znav-primary').textContent='Tải từ vựng';
  try{
   if(!session)throw Error('Vui lòng đăng nhập để chọn lớp.');
   const result=await window.bbgCall('getBbgVocabularySample',{token:session,gameMode:'naval',listClasses:true},{priority:'interactive'});
   if(g!==generation||!dialog.open)return;if(!validSession())throw Error('Phiên đăng nhập đã thay đổi. Hãy mở lại game.');
   if(!result?.ok)throw Error(result?.error?.message||'Không tải được lớp học.');
   const classes=result.data?.classes||[];if(!classes.length)throw Error('Chưa có lớp học để chọn.');
   classes.forEach(c=>select.append(new Option((c.className||c.classCode)+' · '+c.classCode,c.classCode)));
   select.disabled=false;$('.znav-status').textContent='Chọn lớp để tự động tải câu hỏi từ bài gần nhất đã ghi nhận.';
  }catch(e){if(g===generation&&dialog.open){fail(e.message);$('.znav-primary').textContent='Tải lại danh sách lớp';}}
 }
 $('.znav-class').addEventListener('change',()=>{if($('.znav-class').value)start();});
 async function start(){
  const classCode=$('.znav-class').value;if(!classCode)return chooseClasses();
  $('.znav-class').disabled=true;
  clearTimers();generation++;const g=generation;locked=true;words=[];deck=[];damage=[0,0];turn=0;round=0;question=null;session=String(window.BBG_STATE?.session?.token||'');scores();
  $('.znav-answers').replaceChildren();$('.znav-word').textContent='Chuẩn bị ra khơi';$('.znav-turn').textContent='BÀI HỌC GẦN NHẤT CỦA LỚP';$('.znav-status').textContent='Đang tải từ vựng của lớp…';$('.znav-primary').disabled=true;
  try{
   if(!session)throw Error('Vui lòng đăng nhập để chơi với bộ từ của bạn.');
   const result=await window.bbgCall('getBbgVocabularySample',{token:session,contentType:'vocabulary',gameMode:'naval',classCode:classCode},{priority:'interactive'});
   if(g!==generation||!dialog.open)return;
   if(!validSession())throw Error('Phiên đăng nhập đã thay đổi. Hãy mở lại game.');
   if(!result?.ok)throw Error(result?.error?.message||'Không tải được từ vựng. Hãy thử lại.');
   if(!result.data?.lesson)throw Error('Lớp này chưa có bài học được ghi nhận. Hãy chọn lớp khác.');

   const raw=(Array.isArray(result.data?.rows)?result.data.rows.map(r=>({word:r[1],meaning:r[2]})):(result.data?.words||[])).map(w=>({word:String(w.word||'').normalize('NFC').trim(),meaning:String(w.meaning||'').normalize('NFC').trim()}));
   const ambiguous=new Map();raw.forEach(w=>{const key=norm(w.word);if(!ambiguous.has(key))ambiguous.set(key,new Set());ambiguous.get(key).add(norm(w.meaning));});
   const seen=new Set();words=raw.filter(w=>{const m=norm(w.meaning);if(!norm(w.word)||!m||seen.has(m)||ambiguous.get(norm(w.word)).size!==1)return false;seen.add(m);return true;});
   if(words.length<4)throw Error('Bài học cần ít nhất 4 từ có nghĩa khác nhau để tạo đủ 4 đáp án. Hãy thử lại khi bộ từ đã đủ.');
   $('.znav-status').textContent='Đang chuẩn bị hai chiến hạm…';
   await Promise.all([loadFrame(0,0),loadFrame(1,0)]);
   if(g!==generation||!dialog.open)return;
   $('.znav-setup').hidden=true;next();
   void warmFrames(g);
  }catch(e){if(g===generation&&dialog.open)fail(e.message||'Không thể tải game.');}
  finally{if(g===generation){$('.znav-primary').disabled=false;$('.znav-class').disabled=false;if(!words.length)$('.znav-setup').hidden=false;}}
 }
 function close(){generation++;clearTimers();locked=true;words=[];deck=[];question=null;session='';}
 dialog.addEventListener('close',close);$('.znav-close').addEventListener('click',()=>dialog.close());
 $('.znav-rotate-home').addEventListener('click',()=>dialog.close());
 $('.znav-primary').addEventListener('click',()=>{if(!words.length||damage.includes(10)||!round)start();else next();});
 const list=document.getElementById('gamesCardList');if(list){const b=document.createElement('button');b.type='button';b.className='znav-launch';b.innerHTML='<span>ĐỐI KHÁNG · 2 ĐỘI</span><strong>⚓ Hải chiến từ vựng</strong><span>Cướp biển vs Hải quân — Chọn đúng nghĩa, khai hỏa đại bác!</span>';b.addEventListener('click',()=>{dialog.showModal();chooseClasses();});list.append(b);const empty=document.getElementById('gamesEmptyState');if(empty)empty.hidden=true;}
})();
</script>
